intro_title: Where the lake sets the pace
intro_text_1: Anake Lodge sits right on the sand in Chembe Village, Cape Maclear — inside Lake Malawi National Park, a UNESCO World Heritage Site famous for its crystal-clear water and hundreds of species of colourful cichlid fish.
intro_text_2: Founded by Andrew Bita and built from local reed, bamboo and grass thatch, the lodge feels less like a hotel and more like home. Every room is named after one of Malawi's peoples — Chewa, Ngoni, Lhomwe and Nyanja — as a tribute to the country that shaped it.
