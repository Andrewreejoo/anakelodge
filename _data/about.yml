# ABOUT PAGE
seo_title: About Anake Lodge | Family-Run Lodge in Cape Maclear, Lake Malawi since 2009
seo_description: The story of Anake Lodge — a family-founded reed-and-thatch retreat on the beach at Cape Maclear, built by Andrew Bita. Meet the founder and find out how to get to Lake Malawi.
eyebrow: Our story · Since 2009
title: A family-founded retreat at Cape Maclear
intro: Nestled at Cape Maclear, Anake Lodge is a family-founded retreat where modern comfort meets untouched nature — a quiet escape designed to let the lake do the talking.
image: https://www.anakelodge.com/images/other/6.jpg
founder_name: Andrew Bita
founder_image: https://www.anakelodge.com/images/owner/owner.avif
founder_title: His deep connection to Malawi, made visible
founder_paragraphs:
  - Established by Andrew Bita, the lodge is a reflection of his deep connection to Malawi. His hands-on approach ensures an experience that feels less like a hotel and more like home.
  - Every detail — from the locally sourced reed, bamboo and thatch to the names of our rooms — is a tribute to the Malawian landscape and its people. Our team comes from Chembe village, and the guides, fishermen and cooks you meet here are our neighbours.
