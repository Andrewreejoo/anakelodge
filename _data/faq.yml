# FREQUENTLY ASKED QUESTIONS — shown on the home page and sent to Google as FAQ data.
questions:
  - q: Where is Anake Lodge?
    a: On the beach in Chembe Village, Cape Maclear, Mangochi District — inside Lake Malawi National Park, a UNESCO World Heritage Site.
  - q: How do I get to Cape Maclear from Lilongwe airport?
    a: We arrange fixed-rate private taxi transfers per vehicle — Lilongwe airport to Cape Maclear $150, Blantyre to Cape Maclear $160, and Cape Maclear to Liwonde $120. Add a transfer to your booking request.
  - q: How do I book a room?
    a: Send a booking request on our booking page. It reaches us by email and WhatsApp at the same time, and we reply to confirm availability and payment — usually within a few hours. You can also WhatsApp us directly on +265 888 743 955.
  - q: Is breakfast included?
    a: Yes. All private rooms are bed & breakfast, served on the lakefront deck.
  - q: What can I do at Cape Maclear?
    a: Snorkel among cichlid fish, take a boat trip to the islands, paddle out with local fishermen in a dugout canoe, kayak, walk through Chembe village and watch the sunset over the lake.
  - q: Do you have budget or backpacker accommodation in Cape Maclear?
    a: Yes — our Nyanja dormitory has beds from $35 per person per night, with lockers, shared facilities and free Wi-Fi.
  - q: When is the best time to visit Lake Malawi?
    a: May to November is the dry season, with the clearest water for snorkelling. December to April is greener and quieter, with warm afternoon rain.
