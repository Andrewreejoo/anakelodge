# ROOMS & RATES — shown on the home page and in the booking form.
# price is in US dollars. unit is the text shown after the price.
# Add or remove room photos under "photos".

note: Standard and Lake View rates are for one guest; add $20 per additional guest. Book direct for the best rate.

rooms:
  - name: Lake View Room
    tribe: Ngoni
    price: 70
    unit: / night
    extra_guest: 20        # added per night for each guest after the first (0 = none)
    per_person: false      # true = price is per guest (dorm beds)
    max_guests: 3
    description: Wake to sunrise over the water, with direct views of Lake Malawi and the hills of the national park from your bed.
    features: [Lake view, Bed & breakfast, En-suite, Free Wi-Fi]
    photos:
