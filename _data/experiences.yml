# THINGS TO DO — the first item is shown largest.
title: Things to do in Cape Maclear
subtitle: Everything starts at the edge of the lake. Ask at reception and we'll arrange it with trusted local guides from Chembe village.
items:
  - title: Snorkelling with cichlids
    text: Some of the most colourful freshwater fish on earth, just off the beach.
    image: https://www.anakelodge.com/images/home_slides/homeslide_6.jpg
  - title: Dugout canoe fishing
    text: Paddle out with local fishermen at first light.
    image: https://www.anakelodge.com/images/home_slides/homeslide_5.jpg
  - title: Island boat trips
    text: Cruise to Thumbi West and Mumbo islands and watch fish eagles swoop.
    image: https://www.anakelodge.com/images/home_slides/homeslide_8.jpg
  - title: Lakefront dining
    text: Fresh chambo, cold drinks, open views.
    image: https://www.anakelodge.com/images/home_slides/homeslide_3.jpg
  - title: Beach days
    text: Swim, read, repeat.
    image: https://www.anakelodge.com/images/home_slides/homeslide_2.jpg
  - title: Sunsets over the island
    text: The best seat is the one on our deck.
    image: https://www.anakelodge.com/images/home_slides/homeslide_1.jpg
